<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дебетовая карта ALL Airlines</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 400px;
            text-align: center;
        }
        .card h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .card p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .card .highlight {
            color: #000;
            font-weight: bold;
        }
        .btn {
            display: inline-block;
            background-color: #FFDD2D; /* Желтый цвет Т-Банка */
            color: #333;
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #ffd000;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Карта ALL Airlines</h1>
        <p>Получайте <span class="highlight">мили</span> за каждую покупку. Бесплатное обслуживание навсегда при выполнении условий.</p>
        
        <!-- Ссылка на ваш оффер -->
        <a href="https://t-cpa.ru/3Gzq4g" class="btn" target="_blank">Оформить карту</a>
    </div>

</body>
</html>
